[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kyxen-keys"
version = "0.1.0"
description = "Kyxen Keys — open-source Logitech G-key macro manager for Linux"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
keywords = ["logitech", "g-keys", "macro", "linux", "gaming", "keyboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "evdev>=1.6",
    "PySide6>=6.4",
    "tomli-w>=1.0",
]

[project.scripts]
kyxen-daemon   = "kyxen_keys.__main__:main"
kyxen          = "kyxen_keys.gui.app:main"
kyxen-profiler = "kyxen_keys.profiler.__main__:main"

[project.urls]
Homepage   = "https://github.com/quinn-stack/kyxen"
Repository = "https://github.com/quinn-stack/kyxen"
Issues     = "https://github.com/quinn-stack/kyxen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kyxen_keys._assets" = ["*.service", "*.desktop"]
