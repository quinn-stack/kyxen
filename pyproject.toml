[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "openlogikey"
version = "0.1.0"
description = "Open-source Logitech G-key macro manager for Linux"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.11"
keywords = ["logitech", "g-keys", "macro", "linux", "gaming", "keyboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "evdev>=1.6",
    "PySide6>=6.4",
]

[project.scripts]
openlogikey-daemon = "openlogikey.__main__:main"
openlogikey        = "openlogikey.gui.app:main"

[project.urls]
Homepage   = "https://github.com/quinn-stack/openlogikey"
Repository = "https://github.com/quinn-stack/openlogikey"
Issues     = "https://github.com/quinn-stack/openlogikey/issues"

[tool.setuptools.packages.find]
where = ["src"]
